<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 850' width='1200' height='850'>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Playfair+Display:ital,wght@1,600&amp;family=Caveat:wght@600&amp;display=swap');
      .title-bold { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; }
      .text-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .signature { font-family: 'Caveat', cursive; font-size: 34px; }
    </style>
    <pattern id='grid-squares' width='40' height='40' patternUnits='userSpaceOnUse'>
      <rect x='0' y='0' width='20' height='20' fill='#f1f3f5' />
      <rect x='20' y='20' width='20' height='20' fill='#e9ecef' />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width='1200' height='850' fill='#ffffff' />

  <!-- Left Pixel Pattern Decor -->
  <g opacity='0.7'>
    <rect x='0' y='0' width='160' height='850' fill='url(#grid-squares)' />
    <rect x='0' y='60' width='120' height='70' fill='#ced4da' />
    <rect x='60' y='200' width='60' height='90' fill='#dee2e6' />
    <rect x='0' y='380' width='140' height='100' fill='#ced4da' opacity='0.8' />
    <rect x='40' y='550' width='80' height='120' fill='#dee2e6' />
    <rect x='0' y='720' width='160' height='130' fill='#ced4da' />
  </g>

  <!-- Right Pixel Pattern Decor -->
  <g opacity='0.7'>
    <rect x='1040' y='0' width='160' height='850' fill='url(#grid-squares)' />
    <rect x='1080' y='40' width='120' height='100' fill='#dee2e6' />
    <rect x='1040' y='180' width='80' height='120' fill='#ced4da' />
    <rect x='1100' y='360' width='100' height='80' fill='#dee2e6' />
    <rect x='1040' y='500' width='160' height='140' fill='#ced4da' opacity='0.8' />
    <rect x='1080' y='700' width='120' height='150' fill='#dee2e6' />
  </g>

  <!-- Main Certificate Border -->
  <rect x='30' y='30' width='1140' height='790' fill='none' stroke='#e2e8f0' stroke-width='1.5' rx='4' />

  <!-- Content Container -->
  <g transform='translate(600, 0)' text-anchor='middle'>
    
    <!-- Top Header: UiPath Certified Professional Logo -->
    <g transform='translate(-210, 85)' text-anchor='start'>
      <!-- Spark icon -->
      <path d='M-32,12 L-22,0 L-26,16 L-10,12 L-22,24 L-12,32 L-26,28 L-32,44 L-36,28 L-50,32 L-40,24 L-52,12 L-36,16 Z' fill='#fa4616' transform='scale(0.55)' />
      <text x='5' y='16' class='title-bold' font-size='32' fill='#0f172a' letter-spacing='-0.5'>UiPath</text>
      <text x='115' y='16' class='text-sans' font-weight='600' font-size='24' fill='#334155' letter-spacing='0.2'>Certified Professional</text>
    </g>

    <!-- Certificate of Achievement Headline -->
    <text y='245' class='title-bold' font-size='64' fill='#0f172a' letter-spacing='-1.5'>Certificate of</text>
    <text y='325' class='title-bold' font-size='72' fill='#0f172a' letter-spacing='-2'>Achievement</text>

    <!-- Proudly presented to -->
    <text y='415' class='text-sans' font-size='19' fill='#64748b' font-weight='500'>Proudly presented to:</text>

    <!-- Recipient Name -->
    <text y='480' class='title-bold' font-size='44' fill='#0f172a' letter-spacing='-0.5'>Balasabareesh P</text>

    <!-- For successfully completing the -->
    <text y='540' class='text-sans' font-size='18' fill='#64748b'>For successfully completing the:</text>

    <!-- Certificate Program -->
    <text y='590' class='title-bold' font-size='25' fill='#1e293b' letter-spacing='-0.3'>UiPath Certified Professional Automation</text>
    <text y='625' class='title-bold' font-size='25' fill='#1e293b' letter-spacing='-0.3'>Developer Associate Certification</text>

  </g>

  <!-- Footer Section -->
  <!-- Left Side: Issue Date & QR Code -->
  <g transform='translate(200, 720)' text-anchor='start'>
    <!-- QR Code Mock Vector -->
    <g transform='translate(-35, -30) scale(0.65)'>
      <rect width='60' height='60' fill='#0f172a' rx='4' />
      <rect x='6' y='6' width='18' height='18' fill='#ffffff' />
      <rect x='10' y='10' width='10' height='10' fill='#0f172a' />
      <rect x='36' y='6' width='18' height='18' fill='#ffffff' />
      <rect x='40' y='10' width='10' height='10' fill='#0f172a' />
      <rect x='6' y='36' width='18' height='18' fill='#ffffff' />
      <rect x='10' y='40' width='10' height='10' fill='#0f172a' />
      <rect x='30' y='30' width='8' height='8' fill='#ffffff' />
      <rect x='42' y='42' width='12' height='12' fill='#ffffff' />
    </g>
    <text x='25' y='-10' class='text-sans' font-size='18' font-weight='700' fill='#1e293b'>May 6, 2026</text>
    <line x1='25' y1='2' x2='150' y2='2' stroke='#cbd5e1' stroke-width='1.5' />
    <text x='25' y='22' class='text-sans' font-size='14' fill='#64748b'>Date of issue</text>
    <text x='-35' y='52' class='text-sans' font-size='13' font-weight='500' fill='#64748b'>Certification Number: 005419</text>
  </g>

  <!-- Right Side: Signature & Authority -->
  <g transform='translate(970, 720)' text-anchor='end'>
    <!-- Signature text -->
    <text x='0' y='-12' class='signature' fill='#0f172a'>Daniel Dines</text>
    <line x1='-160' y1='2' x2='0' y2='2' stroke='#cbd5e1' stroke-width='1.5' />
    <text x='0' y='22' class='text-sans' font-size='16' font-weight='700' fill='#1e293b'>Daniel Dines</text>
    <text x='0' y='42' class='text-sans' font-size='14' fill='#64748b'>Founder and CEO</text>
  </g>
</svg>